<mat-card>
  <h2>Errori Recenti</h2>

  <mat-list>
    @for (error of store.errors(); track error.id) {
      <mat-list-item>
        <mat-icon matListItemIcon [ngClass]="'sev-' + error.severity.toLowerCase()">priority_high</mat-icon>
        <div matListItemTitle>{{ error.title }}</div>
        <div matListItemLine>{{ error.details }}</div>
        <div matListItemLine>{{ error.createdAt | date: 'dd/MM/yyyy HH:mm' }}</div>
      </mat-list-item>
    }
  </mat-list>
</mat-card>
