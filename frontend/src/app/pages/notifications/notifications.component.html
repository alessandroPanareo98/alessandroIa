<mat-card>
  <h2>Notifiche</h2>

  <mat-list>
    @for (notification of store.notifications(); track notification.id) {
      <mat-list-item [ngClass]="{ unread: !notification.readFlag }">
        <div matListItemTitle>{{ notification.message }}</div>
        <div matListItemLine>
          {{ notification.channel }} - {{ notification.createdAt | date: 'dd/MM HH:mm' }}
        </div>
        @if (!notification.readFlag) {
          <button mat-stroked-button (click)="markRead(notification.id)">Segna come letta</button>
        }
      </mat-list-item>
    }
  </mat-list>
</mat-card>
