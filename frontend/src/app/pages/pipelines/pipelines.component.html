<mat-card>
  <h2>Pipeline</h2>

  <table mat-table [dataSource]="store.pipelines()" class="full-table">
    <ng-container matColumnDef="id">
      <th mat-header-cell *matHeaderCellDef>ID</th>
      <td mat-cell *matCellDef="let row">#{{ row.gitlabPipelineId }}</td>
    </ng-container>

    <ng-container matColumnDef="ref">
      <th mat-header-cell *matHeaderCellDef>Branch</th>
      <td mat-cell *matCellDef="let row">{{ row.refName }}</td>
    </ng-container>

    <ng-container matColumnDef="status">
      <th mat-header-cell *matHeaderCellDef>Stato</th>
      <td mat-cell *matCellDef="let row">
        <mat-chip [ngClass]="'status-' + row.status.toLowerCase()">{{ row.status }}</mat-chip>
      </td>
    </ng-container>

    <ng-container matColumnDef="startedAt">
      <th mat-header-cell *matHeaderCellDef>Avvio</th>
      <td mat-cell *matCellDef="let row">{{ row.startedAt | date: 'dd/MM HH:mm' }}</td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="columns"></tr>
    <tr mat-row *matRowDef="let row; columns: columns"></tr>
  </table>
</mat-card>
