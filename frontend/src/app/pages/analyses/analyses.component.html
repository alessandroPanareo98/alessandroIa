<mat-card>
  <h2>Analisi AI</h2>

  <mat-accordion>
    @for (analysis of store.analyses(); track analysis.id) {
      <mat-expansion-panel>
        <mat-expansion-panel-header>
          <mat-panel-title>
            {{ analysis.severity }} - confidence {{ (analysis.confidence * 100).toFixed(0) }}%
          </mat-panel-title>
        </mat-expansion-panel-header>

        <p><strong>Causa:</strong> {{ analysis.cause }}</p>
        <p><strong>Soluzione:</strong> {{ analysis.solution }}</p>
      </mat-expansion-panel>
    }
  </mat-accordion>
</mat-card>
