server {
    listen 80;
    listen [::]:80;

    server_name iagora.it www.iagora.it;

    # Let's Encrypt
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Tutto il resto va in HTTPS
    location / {
        return 301 https://iagora.it$request_uri;
    }
}


server {
    listen 443 ssl;
    listen [::]:443 ssl;

    server_name iagora.it www.iagora.it;

    ssl_certificate /etc/letsencrypt/live/iagora.it/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/iagora.it/privkey.pem;

    root /usr/share/nginx/html;
    index index.html;

    # Angular
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Spring Boot
    location /api/ {
        proxy_pass http://backend:8080/api/;

        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}