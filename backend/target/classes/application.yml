spring:
  application:
    name: ai-devops-assistant-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://postgres:5432/aidevops_dev}
    username: ${POSTGRES_USER:postgres}
    password: ${POSTGRES_PASSWORD:postgres}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true

server:
  port: ${SERVER_PORT:8080}

logging:
  level:
    root: INFO
    com.aidevops.backend: INFO

app:
  jwt:
    secret: ${JWT_SECRET:replace-with-very-long-secret-key-at-least-32-chars}
    expiration-minutes: ${JWT_EXP_MIN:120}
  ai:
    base-url: ${AI_BASE_URL:http://ollama:11434}
    generate-path: ${AI_GENERATE_PATH:/api/chat}
    model: ${AI_MODEL:llama3.2}
  gitlab:
    base-url: ${GITLAB_URL:https://gitlab.com}
    token: ${GITLAB_TOKEN:}
    webhook-token: ${GITLAB_WEBHOOK_TOKEN:change-me}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
